name: adaptive_dialog
description: Show alert dialog or modal action sheet adaptively according to platform.
version: 3.0.0
repository: https://github.com/mono0926/adaptive_dialog
funding:
  - https://github.com/sponsors/mono0926
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'
dependencies:
  animations: ^3.0.0
  collection: ^1.15.0
  cupertino_ui: ^1.0.0
  dynamic_color: ^2.0.0
  flutter:
    sdk: flutter
  macos_ui: ^2.0.0
  material_ui: ^1.0.0
  meta: ^1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  pedantic_mono: any
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
screenshots:
  - description: 'Adaptive dialog image'
    path: assets/showOkAlertDialog.png
  - description: 'Adaptive dialog sample code'
    path: assets/showOkAlertDialog-code.png
topics:
  - dialog
  - adaptive
  - alert
  - popup
